<!--
학습 계획서 뼈대 견본. 정본 양식: rules-lazy/background-task.md 의 학습 계획서 보고 양식 절.
세션은 PLAN 객체와 title 만 고친다. 그 아래 코드(렌더 · 확대 · 토글 · 메모)는 고치지 않는다.
검사: python3 -I skills/figure/templates/check_template.py <이 파일의 사본>

채울 곳 목록 (본문과 자료에 같은 번호가 하나씩 있어야 한다):
채움[F01] title: 계획 이름 (2 ~ 4 낱말, 설명을 붙이지 않는다)
채움[F02] PLAN.meta: 제목 · 의뢰서 경로 · 커밋 · 상태 · 작성
채움[F03] PLAN.conclusion: 결론 2줄
채움[F04] PLAN.flow: 전체 흐름 ASCII 도해
채움[F05] PLAN.stages: 단계 표
채움[F06] PLAN.base: 기준판 구조도 (블록과 연결)
채움[F07] PLAN.blockInfo: 기준판 블록 설명 (무엇 · 어떻게 · 왜 · 그림)
채움[F08] PLAN.cards: 실험 카드 (설정 하나 = 카드 한 장, 차이 diffs 포함)
채움[F09] PLAN.terms: 용어표
채움[F10] PLAN.decisions: 결정 필요 항목
채움[F11] PLAN.brief 와 PLAN.confidence: Brief 와 정확도
채움[F12] plan-code: 블록별 실제 코드와 줄별 해설

작성 지침:
 - 자리값은 «<여기에 …>» 나 «<용어 …>» 꼴로 쓴다. 채운 뒤에는 이 꼴이 하나도 남으면 안 된다
   (검사: check_template.py 에 --filled 를 붙인다).
 - written 은 «YYYY-MM-DD HH:MM» 꼴로 쓴다.
 - 견본 두 카드의 diffs 종류는 예시일 뿐이다. 카드 수와 카드마다의 diffs 는 자기 설정에 맞게 바꾼다.
   달라진 블록이 없는 카드는 diffs: {} 로 둔다.
 - kind 는 changed(바뀜) · new(새로 생김) · off(꺼짐) · frozen(얼림) 넷 중 하나다. 한 블록에는 하나만 쓴다.
 - 새로 생긴 블록은 그 카드의 extraBlocks 에 { id, label, x, y, w, h } 로 넣는다
   (좌표는 base.blocks 와 같은 좌표계, 겹치지 않게). 연결은 extraEdges 에 [fromId, toId] 로 넣는다
   (기준판 edges 에 더해 그려진다). diffs 에 같은 id 로 kind: "new" 를 두고, before 에는 그 자리의
   기준판 블록 설명이나 전용 «전» 그림을 넣는다.
 - base.blocks 의 수 · 좌표 · id 도 자기 구조에 맞게 바꾼다 (id 는 blockInfo · diffs 의 키와 맞춘다).
 - decisions 는 개수 제한이 없고, 없으면 빈 배열이다 (견본의 두 줄은 예시).
 - 블록 예시 그림(blockInfo · diffs 의 img)은 생성형(Codex 이미지 생성 · Grok)으로만 만든다. 코드로 그린 그림을 넣지 않는다.
   채운 계획서에 img: null 이 남으면 --filled 검사가 실패한다.
 - plan-code 는 JSON 이다(큰따옴표 · 끝 쉼표 없음 · 코드 속 `"` 와 `\` 는 `\"` · `\\` 로, `</script>` 는 `<\/script>` 로 적는다).
 - 블록마다 그 블록을 구현한 실제 코드를 전부 싣고 줄마다 무엇을 · 어떻게 · 왜를 적는다. import 줄 · 빈 줄 · 주석 줄은 싣지 않고 n 은 실제 파일 줄 번호를 쓴다.
 - 같은 꼴이 반복되는 줄은 대표 줄에만 해설을 쓰고 covers 에 적용 줄을 적는다(예: "L10 · L12 · L14", "L44 ~ L51"). 나머지 줄은 ref 로 대표 줄 번호만 가리킨다. 여러 줄에 걸친 한 문장(괄호만 있는 줄 포함)도 첫 줄을 대표로 삼는다.
 - 수식이 든 줄과 모델 관련 줄(layer · optimizer · loss 등)에만 aid 를 둔다. 그림은 생성형(Codex 이미지 생성 · Grok)으로만 만든다. 참고 줄은 대표 줄의 그림을 함께 쓴다.
 - 선택 근거와 참고 자료(choice)는 class 줄이나 def 줄에만 둔다(줄 · 개념 단위로 두지 않는다). why 에는 그 class 나 def 의 구조 · 방법을 왜 골랐는지를 대안과 견주어 적고, refs 에는 근거가 된 논문 · 기술 보고서를 title · year · url · note · check 로 적는다. class 안의 메서드는 그 class 의 choice 로 묶는다.
 - 논문은 인용 검증(citation-verifier)을 거친 것만 싣고 check 에 검증 결과와 날짜를 적는다. 논문이 아닌 자료는 check 에 확인한 방법과 날짜를 적는다. url 은 http(s) 주소만 쓴다.
 - 그림은 만들기 전에 온톨로지에서 먼저 찾는다(개념 그림 knowledge/concepts/, 블록 예시 그림 knowledge/<프로젝트>/figures/). 새로 만든 그림은 검수 뒤 그 자리에 노트와 함께 보관한다(skills/figure/SKILL.md § 그림 보관과 재사용).
 - 전/후가 있는 블록은 diffs 에 기준판 코드(before)와 이 판 코드(after)를 따로 싣고, 이 판에서 새로 생긴 줄은 mark: "new", 바뀐 줄은 mark: "changed" 로 표시한다. 코드가 없는 블록은 none 에 까닭을 적는다.

게시 방법:
 1) 선언 capabilities: {db: {}, user: {}} 로 게시한다 (메모 저장에 쓴다).
 2) 실제 그림은 게시할 때 함께 올리는 파일로 두고 상대 경로를 img 에 적는다. img 가 null 이면 코드가 자리값 그림을 만든다. 코드 이해용 그림도 같은 방식으로 올리고 plan-code 의 aid.img 에 상대 경로를 적는다.
 3) 계획서 확인이 끝나면 메모 저장소를 세션 임시 폴더에 백업한 뒤 아티팩트를 지운다
    (정본: rules-lazy/background-task.md 의 학습 계획서 보고 양식 절, 확인 뒤 삭제 · 삭제 전 백업 항목).
-->

/** 자리값 그림: 토큰 값을 읽어 SVG data URI 로 만든다 */

/** 화면 가득 덮개: Esc 나 닫기로 맨 위 것부터 닫는다 */

/** 구조도 그리기 */
function specFor(c, view) {
  if (view === "base") return { blocks: PLAN.base.blocks, edges: PLAN.base.edges, st: {} };
  const st = {};
  Object.keys(c.diffs).forEach((id) => { st[id] = c.diffs[id].kind; });
  return { blocks: PLAN.base.blocks.concat(c.extraBlocks), edges: PLAN.base.edges.concat(c.extraEdges), st };
}
function clip(b, to) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, dx = to[0] - cx, dy = to[1] - cy;
  if (!dx && !dy) return [cx, cy];
  const t = Math.min(dx ? b.w / 2 / Math.abs(dx) : 1e9, dy ? b.h / 2 / Math.abs(dy) : 1e9);
  return [cx + dx * t, cy + dy * t];
}
function draw(svg, spec) {
  const sid = svg.id, by = {};
  spec.blocks.forEach((b) => { by[b.id] = b; });
  let h = '<defs><marker id="' + sid + '-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="ah"/></marker>' +
    '<pattern id="' + sid + '-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="hatch-bg"/><line x1="0" y1="0" x2="0" y2="8" class="hatch-ln"/></pattern></defs>';
  spec.edges.forEach((e) => {
    const a = by[e[0]], b = by[e[1]];
    if (!a || !b) return;
    const off = spec.st[e[0]] === "off" || spec.st[e[1]] === "off";
    const p = clip(a, [b.x + b.w / 2, b.y + b.h / 2]), q = clip(b, [a.x + a.w / 2, a.y + a.h / 2]);
    h += '<line class="ed' + (off ? " off" : "") + '" x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1) + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '"' + (off ? "" : ' marker-end="url(#' + sid + '-ah)"') + "/>";
  });
  spec.blocks.forEach((b) => {
    const k = spec.st[b.id], K = k ? KIND[k] : null;
    h += '<g class="nd' + (k ? " " + k : "") + '" data-id="' + esc(b.id) + '" tabindex="0" role="button" aria-label="' + esc(b.label) + (K ? " (" + K.t + ")" : "") + ' 설명 보기">' +
      '<rect class="bx" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="3"/>' +
      (k === "off" ? '<rect class="hx" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="3" fill="url(#' + sid + '-hatch)" pointer-events="none"/>' : "") +
      '<text class="lb" x="' + (b.x + b.w / 2) + '" y="' + (b.y + b.h / 2 + 4) + '" text-anchor="middle">' + esc(b.label) + "</text>";
    if (K) h += '<rect class="tagbg" x="' + (b.x + b.w - 40) + '" y="' + (b.y - 9) + '" width="36" height="16" rx="2"/><text class="tag" x="' + (b.x + b.w - 22) + '" y="' + (b.y + 3) + '" text-anchor="middle">' + K.t + "</text>";
    h += "</g>";
  });
  svg.innerHTML = h;
}

  let h2 = null;
  document.querySelectorAll("h2").forEach((x) => { if (x.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) h2 = x; });
  if (el.closest && el.closest("header")) parts.push("머리"); else if (h2) parts.push("절 «" + h2.textContent.trim() + "»");
  if (card) parts.push("카드 «" + card.querySelector("h3").textContent.trim() + "»");
  if (nd && card) { const b = blockOf(cardOf(card.id.replace("card-", "")), nd.dataset.id); if (b) parts.push("구조도 블록 «" + b.label + "»"); }
  const dd = el.closest && el.closest("dd");
  if (dd && dd.previousElementSibling) parts.push("«" + dd.previousElementSibling.textContent.trim() + "» 줄");
  const tx = (el.textContent || "").replace(/\s+/g, " ").trim();
  if (sel) parts.push("고른 글 «" + sel.slice(0, 200) + (sel.length > 200 ? "…" : "") + "»");
  else if (tx) parts.push("요소 글 «" + tx.slice(0, 60) + (tx.length > 60 ? "…" : "") + "»");
  return parts.join(" · ") || "페이지";
}

/** 메모 한 장: 복사한 메모는 지우지 않고 «복사함 날짜» 만 표시, 추가 메모는 followups */
function memoEl(m, place) {
  const col = safeColor(m.color), fu = m.followups || [], fuId = "m-fu-" + place + "-" + String(m.id).replace(/[^\w-]/g, "_");
  const d = document.createElement("div");
  d.className = "memo" + (m.copied ? " copied" : "");
  d.setAttribute("style", cvar(col));
  const badge = m.copied ? '<span class="mbadge ok">복사함 ' + esc(hm(m.copiedAt)) + "</span>" : '<span class="mbadge">아직 복사 안 함</span>';
  const fuHtml = fu.length ? '<div class="mfu"><b>추가 메모 ' + fu.length + "회</b>" + fu.map((f, i) => "<div><span class=\"mm\">" + (i + 1) + "회 · " + esc(hm(f.at)) + " · " + (f.copied ? "복사함 " + esc(hm(f.copiedAt)) : "아직 복사 안 함") + "</span>" + esc(f.text) + "</div>").join("") + "</div>" : "";
  d.innerHTML = '<div class="mt"><span class="mm">#' + esc(m.no || "?") + " " + badge + " " + esc(plabel(col)) + " · " + esc(m.where || "") + (m.at ? " · " + esc(hm(m.at)) : "") + "</span>" + esc(m.text || "") + fuHtml + '<div class="mfuhost"></div></div>' +
    '<div class="macts"><button type="button" class="mbtn go">위치로</button>' + (m.copied ? '<button type="button" class="mbtn addfu">추가 메모</button>' : '<button type="button" class="mbtn del">지우기</button>') + "</div>";
  d.querySelector(".go").addEventListener("click", () => goMemo(m));
  const del = d.querySelector(".del");
  if (del) del.addEventListener("click", () => {
    if (del.dataset.armed !== "1") {
      del.dataset.armed = "1";
      del.textContent = "정말 지우기";
      setTimeout(() => { del.dataset.armed = ""; del.textContent = "지우기"; }, 4000);

    }

    db.collection("memos").doc(m.id).delete().catch(() => { d.classList.remove("busy"); setStat("지우지 못했습니다. 잠시 뒤 다시 눌러 주십시오."); });

    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const t = ta.value.trim();
      if (!t) { ta.focus(); return; }
      const sb = f.querySelector("[type=submit]");
      sb.disabled = true;
      db.collection("memos").doc(m.id).update({ followups: fu.concat([{ text: t, at: new Date().toISOString(), copied: false, copiedAt: "" }]) })
        .then(() => setStat("#" + m.no + " 에 추가 메모를 남겼습니다(아직 복사 안 함)."))
        .catch(() => { sb.disabled = false; setStat("추가 메모를 저장하지 못했습니다."); });

/** 위치로: 카드와 보기 · 블록 설명 창을 먼저 열고 그 요소로 이동한 뒤 메모 내역을 펼친다 */
function goMemo(m) {
  try {
    let card = m.card ? $("card-" + m.card) : null;
    if (!card && m.path) { const t0 = byPath(m.path); card = t0 && t0.closest ? t0.closest(".card") : null; }
    const dr = $("mdr");
    if (dr) dr.hidden = true;
    closePinList();
    if (card) {
      const fig = card.querySelector(".fig");
      // 메모를 달 때의 보기(기준판 / 이 판)로 먼저 되돌린 뒤 설명 창을 연다
      const want = m.view === "base" || m.view === "this" ? m.view : "";
      if (fig && want && fig.dataset.view !== want) { const tb = fig.querySelector('.fbar .tog button[data-v="' + want + '"]'); if (tb) tb.click(); }
      if (fig && m.inInfo && m.node) showInfo(fig, m.node);
    }
    let t = byPath(m.path);
    if (t && m.inInfo && card && !card.contains(t)) t = null;
    if (!t && card) t = (m.inInfo && card.querySelector(".info:not([hidden])")) || card;
    if (!t) { setStat("위치를 찾지 못했습니다."); return; }
    setTimeout(() => {
      t.scrollIntoView({ block: "center" });
      t.classList.add("mflash");
      setTimeout(() => t.classList.remove("mflash"), 1800);
      markAnchors();
      setTimeout(() => {
        const btn = pinBtn(m.path);
        openPinList(m.path, btn && !btn.hidden ? btn : t);
      }, 350);
    }, 60);
  } catch (err) {
    setStat("위치를 찾지 못했습니다.");
  }
}
/** 경로 문자열은 선택자에 넣지 않고 순회로 비교한다 (저장소에서 읽은 값이라 따옴표가 있어도 예외가 나지 않는다) */
function pinBtn(path) {
  return pinLayer ? Array.from(pinLayer.querySelectorAll(".mpin")).find((b) => b.dataset.path === path) || null : null;
}

/** 메모를 단 자리마다 «메모 N» 표지 (body 끝 겹침 층이라 본문 요소 경로는 바뀌지 않는다) */
function markAnchors() {
  document.querySelectorAll("[data-memo]").forEach((e) => { e.removeAttribute("data-memo"); e.style.removeProperty("--mb"); });
  if (!pinLayer) { pinLayer = document.createElement("div"); pinLayer.className = "mpins"; document.body.appendChild(pinLayer); }
  pinLayer.innerHTML = "";
  const groups = {};
  memos.forEach((m) => { if (m.path) (groups[m.path] = groups[m.path] || []).push(m); });
  Object.keys(groups).forEach((p) => {
    const t = byPath(p), g = groups[p].slice().sort((a, b) => (a.no || 0) - (b.no || 0)), last = g[g.length - 1];
    if (!t || !t.setAttribute) return;
    const col = safeColor(last.color);
    t.setAttribute("data-memo", col);
    t.style.setProperty("--mb", "var(--m-" + col + "-b)");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mpin";
    b.dataset.path = p;
    b.setAttribute("style", cvar(col));
    const nf = g.reduce((a, m) => a + (m.followups || []).length, 0);
    b.textContent = "메모 " + g.length + (nf ? " · 추가 " + nf : "");
    b.setAttribute("aria-label", "이 자리 메모 " + g.length + "개 보기");
    b.addEventListener("click", (e) => { e.stopPropagation(); openPinList(p, b); });
    pinLayer.appendChild(b);
  });
  placePins();
}
function placePins() {
  if (!pinLayer) return;
  pinLayer.querySelectorAll(".mpin").forEach((b) => {
    const t = byPath(b.dataset.path), r = t && t.getBoundingClientRect ? t.getBoundingClientRect() : null;
    if (!r || (!r.width && !r.height)) { b.hidden = true; return; }
    b.hidden = false;
    const w = b.offsetWidth || 60;
    b.style.left = Math.max(4, Math.min(r.right + window.scrollX - w, document.documentElement.scrollWidth - w - 4)) + "px";
    b.style.top = Math.max(4, r.top + window.scrollY - 10) + "px";
  });
}
let pinT = null;
function placeSoon() { clearTimeout(pinT); pinT = setTimeout(placePins, 60); }
function closePinList() { if (pinPop) { pinPop.remove(); pinPop = null; } }
function closePop() { if (pop) { pop.remove(); pop = null; } }
function openPinList(p, anchorEl) {
  closePinList();
  closePop();
  const g = memos.filter((m) => m.path === p).sort((a, b) => (a.no || 0) - (b.no || 0));
  if (!g.length) return;
  pinPop = document.createElement("div");

  pinPop.innerHTML = '<div class="figbar"><b>이 자리 메모 ' + g.length + '개</b><button type="button" class="mbtn close" style="margin-left:auto">닫기</button></div><div class="mstat">' + esc(g[0].where || "") + '</div><div class="memos" style="max-height:60vh;overflow:auto"></div>';
  const box = pinPop.querySelector(".memos");
  g.forEach((m) => box.appendChild(memoEl(m, "pin")));
  document.body.appendChild(pinPop);
  const r = anchorEl.getBoundingClientRect(), w = Math.min(420, window.innerWidth - 24);
  pinPop.style.width = w + "px";
  pinPop.style.left = Math.max(12, Math.min(r.left, window.innerWidth - w - 12)) + "px";
  pinPop.style.top = Math.max(12, Math.min(r.bottom + 6, window.innerHeight - pinPop.offsetHeight - 12)) + "px";
  const cl = pinPop.querySelector(".close");
  cl.addEventListener("click", closePinList);
  cl.focus();
}

/** 메모 모드: 페이지 어디든 누르거나 글자를 고르면 그 자리에 메모 창. «작성 완료» 는 저장만 한다 */
function swatches(name, sel) {

}
function openAt(el, sel, x, y) {

      .catch(() => { sb.disabled = false; err.textContent = "저장하지 못했습니다. 다시 눌러 주십시오."; });

const inMemoUi = (t) => t.closest && t.closest(".mpop,.mdrawer,.mfabs,.mrvtop,.mpins,.mcopybox,.mnote,.ov,.imgov");

/** 메모 복사: 클릭 처리기 안에서만 부른다. 세션 채팅에 붙여 넣을 안내 글(메모 내용 없이 번호만)을 클립보드에 복사한다 */
function copyMemos() {
  const c = uncopiedCount();
  if (!c[0] && !c[1]) { setStat("복사할 새 메모가 없습니다."); return; }
  const fresh = [], more = [];
  memos.slice().sort((a, b) => (a.no || 0) - (b.no || 0)).forEach((m) => {
    if (!m.copied) fresh.push("#" + m.no);
    if ((m.followups || []).some((f) => !f.copied)) more.push("#" + m.no);
  });
  const parts = [];
  if (c[0]) parts.push("새 메모 " + c[0] + "건(" + fresh.join(" · ") + ")");
  if (c[1]) parts.push("추가 메모 " + c[1] + "건(" + more.join(" · ") + ")");
  const text = "학습 계획서 «" + PLAN.meta.title + "» 에 메모를 남겼습니다. " + parts.join(", ") + ". 계획서 아티팩트의 메모 저장소(memos 컬렉션)를 읽어 확인해 주십시오. 검토 상태: " + review + ".";
  const targets = memos.filter((m) => !m.copied || (m.followups || []).some((f) => !f.copied));
  const form = $("mcopyform"), ta = $("mcopytext");
  const fallback = () => {
    ta.value = text;
    form.hidden = false;
    ta.focus();
    ta.select();
    setStat("복사가 막혀 있습니다. 아래 글을 직접 복사해 세션 채팅에 붙여 넣어 주십시오.");
  };
  // 클릭 처리기 안에서 그 앞에 기다림 없이 곧바로 부른다 (사용자 몸짓 창을 넘기지 않기 위해). 미지원과 거절은 모두 글 상자로 떨어진다
  let p = null;
  try { if (navigator.clipboard && navigator.clipboard.writeText) p = navigator.clipboard.writeText(text); } catch (err) { p = null; }
  if (p) p.then(() => { form.hidden = true; setStat("안내 글을 복사했습니다. 세션 채팅에 붙여 넣어 주십시오."); }).catch(fallback);
  else fallback();
  const now = new Date().toISOString();
  Promise.all(targets.map((m) => {
    const patch = { followups: (m.followups || []).map((f) => (f.copied ? f : Object.assign({}, f, { copied: true, copiedAt: now }))) };
    if (!m.copied) { patch.copied = true; patch.copiedAt = now; }
    return db.collection("memos").doc(m.id).update(patch);
  })).catch(() => setStat("메모의 «복사함» 표시를 저장하지 못했습니다. 메모는 그대로 남아 있습니다."));
}

  document.body.appendChild(dr);
  $("mmode").addEventListener("click", () => setMode(!memoMode));
  $("mfab").addEventListener("click", () => { dr.hidden = !dr.hidden; if (!dr.hidden) $("mclose").focus(); });
  $("mclose").addEventListener("click", () => { dr.hidden = true; $("mfab").focus(); });
  $("mcopyfab").addEventListener("click", copyMemos);
  $("mcopyclose").addEventListener("click", () => { $("mcopyform").hidden = true; });
  document.querySelectorAll("[data-rv]").forEach((b) => b.addEventListener("click", () => setReview(b.dataset.rv)));
  dr.querySelectorAll("#mchips button").forEach((b) => b.addEventListener("click", () => {
    filter = b.dataset.k;
    dr.querySelectorAll("#mchips button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    renderMemos();
  }));
  const timers = {};
  dr.querySelectorAll("#mpurp input").forEach((inp) => inp.addEventListener("input", () => {
    const k = inp.dataset.k;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(() => {
      const v = inp.value.trim();
      if ((purpose[k] || "") === v) return;
      purpose[k] = v;
      const all = {};
      COLORS.forEach((c) => { all[c[0]] = purpose[c[0]] || ""; });
      db.doc("memo_meta/colors").set(all).then(renderMemos).catch(() => setStat("용도를 저장하지 못했습니다."));
    }, 700);
  }));
  document.addEventListener("click", (e) => {
    if (!memoMode || inMemoUi(e.target)) return;
    const s = window.getSelection && window.getSelection(), st = s && !s.isCollapsed ? s.toString().trim() : "";
    e.preventDefault();
    e.stopPropagation();
    let el = e.target;
    if (st && s.rangeCount) { const a = s.getRangeAt(0).commonAncestorContainer; el = a.nodeType === 1 ? a : a.parentElement; }
    if (el.closest && el.closest("g.nd")) el = el.closest("g.nd"); else if (el.closest && el.closest("svg")) el = el.closest("svg");
    openAt(el, st, e.clientX, e.clientY);
  }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && (pop || pinPop)) { closePop(); closePinList(); e.stopImmediatePropagation(); }
  }, true);
  window.addEventListener("resize", placeSoon);
  window.addEventListener("load", placeSoon);
  document.addEventListener("click", placeSoon);
}

function subscribeMemos() {
  const t = setTimeout(() => setStat("메모 저장소 응답을 기다리는 중입니다. 표시된 메모가 최신이 아닐 수 있습니다."), 10000);
  db.collection("memos").orderBy("at", "desc").onSnapshot((s) => {
    if (!s.metadata || !s.metadata.fromCache) { clearTimeout(t); setStat("메모 " + s.size + "개 · 저장소 연결됨"); }
    memos = s.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
    renderMemos();
  }, () => { clearTimeout(t); setStat("메모 저장소 연결이 끊겼습니다. 페이지를 다시 열어 주십시오."); });
  db.doc("memo_meta/review").onSnapshot((s) => {
    const v = s.exists && s.data().status;
    review = v === "검토 완료" ? v : "검토 중";
    renderReview();
  }, () => {});
  db.doc("memo_meta/colors").onSnapshot((s) => {
    purpose = s.exists ? Object.assign({}, s.data()) : {};
    COLORS.forEach((c) => { const i = $("mp-" + c[0]); if (i && document.activeElement !== i) i.value = purpose[c[0]] || ""; });
    renderMemos();
  }, () => {});
}

/** 시작: 본문은 이미 그려졌다. use() 가 풀리지 않거나 null 이면 메모 기능만 끈다 */
const within = (p, ms) => Promise.race([Promise.resolve(p), new Promise((res) => setTimeout(() => res(null), ms))]);
async function initMemo() {
  const note = document.createElement("div");
  note.className = "mnote";
  note.id = "mnote";
  note.setAttribute("role", "status");
  note.textContent = "메모 저장소에 연결하는 중입니다.";
  document.body.appendChild(note);
  try {
    db = await within(window.claude?.use?.("db"), 10000);
  } catch (err) {
    db = null;
  }
  if (!db) { note.textContent = "이 화면에서는 메모를 쓸 수 없습니다"; return; }
  note.remove();
  buildMemoUi();
  subscribeMemos();
  renderMemos();
}
initMemo().catch(() => {
  const n = $("mnote");
  if (n) n.textContent = "이 화면에서는 메모를 쓸 수 없습니다";
});
</script>
